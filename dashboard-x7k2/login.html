<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 로그인 | 하이엔드 수학학원</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { 50:'#E8ECF4',100:'#C5CCE0',200:'#8B99C0',300:'#5166A1',400:'#2B3D6B',500:'#1E2A52',600:'#182243',700:'#121A34',800:'#0C1225',900:'#060A16' },
            gold: { 50:'#FEF9E7',100:'#FCF0C3',200:'#F5DD8A',300:'#EBBA2D',400:'#D4A520',500:'#B8901C',600:'#9C7A18',700:'#806414',800:'#644E10',900:'#48380C' }
          },
          fontFamily: { sans: ['"Noto Sans KR"','sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #0C1225 0%, #1E2A52 40%, #2B3D6B 100%); }
  </style>
</head>
<body class="font-sans text-navy-800 antialiased min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-8">
      <p class="text-sm font-bold text-gold-500 tracking-widest uppercase mb-2">Admin</p>
      <h1 class="text-2xl font-black text-navy-500">관리자 로그인</h1>
    </div>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-navy-600 mb-1">이메일</label>
        <input type="email" id="email" required autocomplete="username"
          class="w-full px-4 py-2.5 border border-navy-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-navy-300">
      </div>
      <div>
        <label class="block text-sm font-medium text-navy-600 mb-1">비밀번호</label>
        <input type="password" id="password" required autocomplete="current-password"
          class="w-full px-4 py-2.5 border border-navy-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-navy-300">
      </div>
      <p id="error-msg" class="text-sm text-red-500 hidden"></p>
      <button type="submit" id="submit-btn"
        class="w-full px-5 py-3 bg-navy-500 text-white text-sm font-bold rounded-lg hover:bg-navy-400 focus:outline-none focus:ring-2 focus:ring-gold-300 focus:ring-offset-2 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed transition-transform duration-150">
        로그인
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = './index.html';
    })();

    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = '로그인 중...';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
        errorMsg.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = '로그인';
        return;
      }
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
