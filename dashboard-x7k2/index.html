<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 페이지 | 하이엔드 수학학원</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { 50:'#E8ECF4',100:'#C5CCE0',200:'#8B99C0',300:'#5166A1',400:'#2B3D6B',500:'#1E2A52',600:'#182243',700:'#121A34',800:'#0C1225',900:'#060A16' },
            gold: { 50:'#FEF9E7',100:'#FCF0C3',200:'#F5DD8A',300:'#EBBA2D',400:'#D4A520',500:'#B8901C',600:'#9C7A18',700:'#806414',800:'#644E10',900:'#48380C' }
          },
          fontFamily: { sans: ['"Noto Sans KR"','sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { background-color: #f5f3f0; }
    .tab-btn { transition: color 0.2s ease, border-color 0.2s ease; }
    .tab-btn.active { color: #1E2A52; border-color: #EBBA2D; }
    .tab-btn:not(.active) { color: #8B99C0; border-color: transparent; }
    .btn-primary { background:#1E2A52; }
    .btn-primary:hover { background:#2B3D6B; transform: scale(1.02); }
    .btn-primary:focus { outline:none; box-shadow: 0 0 0 2px #EBBA2D; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-danger { background:#fff; color:#dc2626; border:1px solid #fecaca; }
    .btn-danger:hover { background:#fef2f2; transform: scale(1.02); }
    .btn-danger:focus { outline:none; box-shadow: 0 0 0 2px #fecaca; }
    .btn-danger:active { transform: scale(0.98); }
    .btn-ghost { background:#fff; color:#1E2A52; border:1px solid #E8ECF4; }
    .btn-ghost:hover { background:#E8ECF4; transform: scale(1.02); }
    .btn-ghost:focus { outline:none; box-shadow: 0 0 0 2px #C5CCE0; }
    .btn-ghost:active { transform: scale(0.98); }
    input, textarea, select { transition: border-color 0.2s ease, box-shadow 0.2s ease; }
    input:focus, textarea:focus, select:focus { outline:none; border-color:#1E2A52; box-shadow: 0 0 0 2px #C5CCE0; }
  </style>
</head>
<body class="font-sans text-navy-800 antialiased">

  <div id="app" class="hidden">
    <header class="bg-navy-500 text-white">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
        <div>
          <p class="text-xs font-bold text-gold-300 tracking-widest uppercase">Admin</p>
          <h1 class="text-lg font-black">하이엔드 수학학원 관리자</h1>
        </div>
        <button id="logout-btn" class="btn-ghost px-4 py-2 rounded-lg text-sm font-bold">로그아웃</button>
      </div>
    </header>

    <nav class="bg-white border-b border-navy-100 sticky top-0 z-10">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 flex gap-6">
        <button data-tab="schedule" class="tab-btn active px-1 py-4 text-sm font-bold border-b-2">시간표 관리</button>
        <button data-tab="results" class="tab-btn px-1 py-4 text-sm font-bold border-b-2">대입결과 관리</button>
        <button data-tab="naesin" class="tab-btn px-1 py-4 text-sm font-bold border-b-2">내신결과 관리</button>
        <button data-tab="notices" class="tab-btn px-1 py-4 text-sm font-bold border-b-2">공지사항 관리</button>
        <button data-tab="teachers" class="tab-btn px-1 py-4 text-sm font-bold border-b-2">강사 관리</button>
        <button data-tab="facilities" class="tab-btn px-1 py-4 text-sm font-bold border-b-2">시설 사진 관리</button>
      </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-10">

      <!-- ============ 시간표 관리 ============ -->
      <section id="panel-schedule" class="tab-panel">
        <div class="bg-white rounded-2xl border border-navy-50 p-6 mb-8">
          <h2 id="class-form-title" class="text-base font-bold text-navy-500 mb-4">새 반 추가</h2>
          <form id="class-form" class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">구분</label>
              <select id="class-division" class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm">
                <option value="고등부">고등부</option>
                <option value="중등부">중등부</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">학년</label>
              <select id="class-grade" class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm"></select>
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">반 이름</label>
              <input id="class-code" required class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm" placeholder="예: S1, A1, 대수 선행반">
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">시간</label>
              <input id="class-time" required class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm" placeholder="예: 월금 6:00~10:00">
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">담당강사</label>
              <input id="class-teacher" required class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm" placeholder="예: 허준우T">
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">정렬 순서 (작을수록 위)</label>
              <input id="class-order" type="number" value="0" class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm">
            </div>
            <div class="sm:col-span-2">
              <label class="block text-xs font-bold text-navy-400 mb-1">반 소개</label>
              <textarea id="class-desc" rows="2" class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm"></textarea>
            </div>
            <div class="sm:col-span-2 flex gap-2">
              <button type="submit" class="btn-primary text-white px-5 py-2.5 rounded-lg text-sm font-bold">저장</button>
              <button type="button" id="class-cancel-btn" class="btn-ghost hidden px-5 py-2.5 rounded-lg text-sm font-bold">취소</button>
            </div>
          </form>
        </div>
        <div id="class-list" class="space-y-3"></div>
      </section>

      <!-- ============ 대입결과 관리 ============ -->
      <section id="panel-results" class="tab-panel hidden">
        <div class="bg-white rounded-2xl border border-navy-50 p-6 mb-8">
          <h2 class="text-base font-bold text-navy-500 mb-4">상단 통계</h2>
          <div id="stats-list" class="space-y-3"></div>
        </div>

        <div class="bg-white rounded-2xl border border-navy-50 p-6 mb-8">
          <h2 id="admission-form-title" class="text-base font-bold text-navy-500 mb-4">대학 합격 실적 추가</h2>
          <form id="admission-form" class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">연도</label>
              <input id="admission-year" type="number" required class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm" placeholder="예: 2025">
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">대학명</label>
              <input id="admission-university" required class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm" placeholder="예: 서울대학교">
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">합격 인원</label>
              <input id="admission-headcount" type="number" required class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">정렬 순서</label>
              <input id="admission-order" type="number" value="0" class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm">
            </div>
            <div class="sm:col-span-2 flex gap-2">
              <button type="submit" class="btn-primary text-white px-5 py-2.5 rounded-lg text-sm font-bold">저장</button>
              <button type="button" id="admission-cancel-btn" class="btn-ghost hidden px-5 py-2.5 rounded-lg text-sm font-bold">취소</button>
            </div>
          </form>
        </div>
        <div id="admission-list" class="space-y-3"></div>
      </section>

      <!-- ============ 내신결과 관리 ============ -->
      <section id="panel-naesin" class="tab-panel hidden">
        <div class="bg-white rounded-2xl border border-navy-50 p-6 mb-8">
          <h2 id="naesin-form-title" class="text-base font-bold text-navy-500 mb-4">내신결과 추가</h2>
          <form id="naesin-form" class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">연도</label>
              <input id="naesin-year" type="number" required class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm" placeholder="예: 2025">
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">학기</label>
              <select id="naesin-semester" class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm">
                <option value="1">1학기</option>
                <option value="2">2학기</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">등급</label>
              <input id="naesin-grade" required class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm" placeholder="예: 1등급">
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">학교</label>
              <input id="naesin-school" required class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm" placeholder="예: 용인 OO고">
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">학생 이름</label>
              <input id="naesin-student" required class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm" placeholder="예: 송태환">
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">정렬 순서</label>
              <input id="naesin-order" type="number" value="0" class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm">
            </div>
            <div class="sm:col-span-2 flex gap-2">
              <button type="submit" class="btn-primary text-white px-5 py-2.5 rounded-lg text-sm font-bold">저장</button>
              <button type="button" id="naesin-cancel-btn" class="btn-ghost hidden px-5 py-2.5 rounded-lg text-sm font-bold">취소</button>
            </div>
          </form>
        </div>
        <div id="naesin-list" class="space-y-3"></div>
      </section>

      <!-- ============ 공지사항 관리 ============ -->
      <section id="panel-notices" class="tab-panel hidden">
        <div class="bg-white rounded-2xl border border-navy-50 p-6 mb-8">
          <h2 id="notice-form-title" class="text-base font-bold text-navy-500 mb-4">공지사항 작성</h2>
          <form id="notice-form" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">제목</label>
              <input id="notice-title" required class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">내용</label>
              <textarea id="notice-content" rows="5" required class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm"></textarea>
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">이미지 (선택)</label>
              <div id="notice-image-preview" class="hidden mb-2">
                <img id="notice-image-preview-img" class="h-32 rounded-lg border border-navy-100 object-cover" src="">
                <label class="flex items-center gap-2 text-xs text-navy-500 mt-1">
                  <input id="notice-image-remove" type="checkbox" class="rounded border-navy-200">
                  이미지 제거
                </label>
              </div>
              <input id="notice-image" type="file" accept="image/*" class="w-full text-sm">
            </div>
            <label class="flex items-center gap-2 text-sm text-navy-600">
              <input id="notice-pinned" type="checkbox" class="rounded border-navy-200">
              상단 고정
            </label>
            <div class="flex gap-2">
              <button type="submit" class="btn-primary text-white px-5 py-2.5 rounded-lg text-sm font-bold">저장</button>
              <button type="button" id="notice-cancel-btn" class="btn-ghost hidden px-5 py-2.5 rounded-lg text-sm font-bold">취소</button>
            </div>
          </form>
        </div>
        <div id="notice-list" class="space-y-3"></div>
      </section>

      <!-- ============ 강사 관리 ============ -->
      <section id="panel-teachers" class="tab-panel hidden">
        <div class="bg-white rounded-2xl border border-navy-50 p-6 mb-8">
          <h2 id="teacher-form-title" class="text-base font-bold text-navy-500 mb-4">새 강사 추가</h2>
          <form id="teacher-form" class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">이름</label>
              <input id="teacher-name" required class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm" placeholder="예: 이동하">
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">직책</label>
              <input id="teacher-role" required class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm" placeholder="예: 원장, 대표 강사">
            </div>
            <div class="sm:col-span-2">
              <label class="block text-xs font-bold text-navy-400 mb-1">경력 (한 줄에 하나씩, 마지막 줄이 현재 소속으로 굵게 표시됩니다)</label>
              <textarea id="teacher-career" rows="4" class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm" placeholder="前) 메가스터디 재수종합반 강사&#10;現) 하이엔드 대표"></textarea>
            </div>
            <div class="sm:col-span-2">
              <label class="block text-xs font-bold text-navy-400 mb-1">소개 문구</label>
              <input id="teacher-quote" class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm" placeholder="예: &quot;같은 노력도 이동하가 만들면 다릅니다.&quot;">
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">정렬 순서 (작을수록 위)</label>
              <input id="teacher-order" type="number" value="0" class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm">
            </div>
            <div class="sm:col-span-2">
              <label class="block text-xs font-bold text-navy-400 mb-1">프로필 사진</label>
              <div id="teacher-photo-preview" class="hidden mb-2">
                <img id="teacher-photo-preview-img" class="h-32 rounded-lg border border-navy-100 object-cover" src="">
              </div>
              <input id="teacher-photo" type="file" accept="image/*" class="w-full text-sm">
            </div>
            <div class="sm:col-span-2 flex gap-2">
              <button type="submit" class="btn-primary text-white px-5 py-2.5 rounded-lg text-sm font-bold">저장</button>
              <button type="button" id="teacher-cancel-btn" class="btn-ghost hidden px-5 py-2.5 rounded-lg text-sm font-bold">취소</button>
            </div>
          </form>
        </div>
        <div id="teacher-list" class="space-y-3"></div>
      </section>

      <!-- ============ 시설 사진 관리 ============ -->
      <section id="panel-facilities" class="tab-panel hidden">
        <div class="bg-white rounded-2xl border border-navy-50 p-6 mb-8">
          <h2 id="facility-form-title" class="text-base font-bold text-navy-500 mb-4">시설 사진 추가</h2>
          <form id="facility-form" class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">이름 (예: 강의실, 자습실)</label>
              <input id="facility-title" required class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm" placeholder="예: 강의실">
            </div>
            <div>
              <label class="block text-xs font-bold text-navy-400 mb-1">정렬 순서 (작을수록 앞)</label>
              <input id="facility-order" type="number" value="0" class="w-full px-3 py-2 border border-navy-100 rounded-lg text-sm">
            </div>
            <div class="sm:col-span-2">
              <label class="block text-xs font-bold text-navy-400 mb-1">사진</label>
              <div id="facility-photo-preview" class="hidden mb-2">
                <img id="facility-photo-preview-img" class="h-32 rounded-lg border border-navy-100 object-cover" src="">
              </div>
              <input id="facility-photo" type="file" accept="image/*" class="w-full text-sm">
            </div>
            <div class="sm:col-span-2 flex gap-2">
              <button type="submit" class="btn-primary text-white px-5 py-2.5 rounded-lg text-sm font-bold">저장</button>
              <button type="button" id="facility-cancel-btn" class="btn-ghost hidden px-5 py-2.5 rounded-lg text-sm font-bold">취소</button>
            </div>
          </form>
        </div>
        <div id="facility-list" class="grid sm:grid-cols-2 gap-3"></div>
      </section>

    </main>
  </div>

  <div id="loading" class="min-h-screen flex items-center justify-center text-navy-400 text-sm">확인 중...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    const GRADES = { '고등부': ['고1','고2','고3'], '중등부': ['중1','중2','중3'] };

    // ---------- 인증 가드 ----------
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = './login.html'; return; }
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      init();
    })();

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await sb.auth.signOut();
      window.location.href = './login.html';
    });

    // ---------- 탭 전환 ----------
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.getAttribute('data-tab');
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
        document.getElementById('panel-' + tab).classList.remove('hidden');
      });
    });

    function init() {
      initClassForm();
      loadClasses();
      loadStats();
      loadAdmissions();
      loadNaesin();
      loadNotices();
      loadTeachers();
      loadFacilities();
    }

    // ================= 시간표 =================
    let editingClassId = null;

    function initClassForm() {
      const divisionEl = document.getElementById('class-division');
      const gradeEl = document.getElementById('class-grade');
      function refreshGrades() {
        gradeEl.innerHTML = GRADES[divisionEl.value].map(g => `<option value="${g}">${g}</option>`).join('');
      }
      divisionEl.addEventListener('change', refreshGrades);
      refreshGrades();
    }

    async function loadClasses() {
      const { data, error } = await sb.from('classes').select('*').order('division').order('grade').order('display_order');
      const list = document.getElementById('class-list');
      if (error) { list.innerHTML = '<p class="text-sm text-red-500">불러오기 실패</p>'; return; }
      if (!data.length) { list.innerHTML = '<p class="text-sm text-navy-300">등록된 반이 없습니다.</p>'; return; }
      list.innerHTML = data.map(row => `
        <div class="bg-white rounded-xl border border-navy-50 p-4 flex items-center justify-between gap-4">
          <div class="min-w-0">
            <p class="text-xs font-bold text-gold-500">${row.division} · ${row.grade}</p>
            <p class="text-sm font-bold text-navy-600 truncate">${row.class_code} <span class="font-normal text-navy-400">· ${row.schedule_time} · ${row.teacher}</span></p>
          </div>
          <div class="flex gap-2 flex-shrink-0">
            <button class="btn-ghost px-3 py-1.5 rounded-lg text-xs font-bold" onclick="editClass('${row.id}')">수정</button>
            <button class="btn-danger px-3 py-1.5 rounded-lg text-xs font-bold" onclick="deleteClass('${row.id}')">삭제</button>
          </div>
        </div>
      `).join('');
      window.__classes = data;
    }

    window.editClass = function (id) {
      const row = window.__classes.find(r => r.id === id);
      if (!row) return;
      editingClassId = id;
      document.getElementById('class-division').value = row.division;
      document.getElementById('class-division').dispatchEvent(new Event('change'));
      document.getElementById('class-grade').value = row.grade;
      document.getElementById('class-code').value = row.class_code;
      document.getElementById('class-time').value = row.schedule_time;
      document.getElementById('class-teacher').value = row.teacher;
      document.getElementById('class-order').value = row.display_order;

        submitBtn.textContent = '사진 업로드 중...';
        try {
          image_url = await uploadFacilityImage(file);
        } catch (err) {
          alert('사진 업로드 실패: ' + err.message);
          submitBtn.disabled = false;
          submitBtn.textContent = '저장';
          return;
        }
        submitBtn.disabled = false;
        submitBtn.textContent = '저장';
      }
      if (!image_url) { alert('사진을 선택해주세요.'); return; }

      const payload = {
        title: document.getElementById('facility-title').value,
        display_order: Number(document.getElementById('facility-order').value) || 0,
        image_url,
      };
      const { error } = editingFacilityId
        ? await sb.from('facilities').update(payload).eq('id', editingFacilityId)
        : await sb.from('facilities').insert(payload);
      if (error) { alert('저장 실패: ' + error.message); return; }
      resetFacilityForm();
      loadFacilities();
    });
  </script>
</body>
</html>
